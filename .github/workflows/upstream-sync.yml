name: Sync upstream

# Keeps this fork's base current with kunkundi/crossdesk without touching the wall feature:
# only merges when the upstream branch is a clean ancestor merge (no conflicts expected).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge upstream master when it is ahead
        run: |
          git config user.name "wall-sync"
          git config user.email "wall-sync@users.noreply.github.com"
          git remote add upstream https://github.com/kunkundi/crossdesk.git || true
          git fetch --depth=1 upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            exit 0
          fi
          if git merge --no-edit upstream/master; then
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            git merge --abort
            echo "::warning::Upstream conflicts with the wall feature; resolve manually."
          fi
